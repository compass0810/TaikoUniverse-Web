<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unidan アカウント連携</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: #14161c; color: #e8eaf0;
    }
    main {
      width: min(440px, 90vw); padding: 32px 28px; border-radius: 14px;
      background: #1e2230; box-shadow: 0 8px 32px rgba(0, 0, 0, .4); text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    p { line-height: 1.7; margin: 0 0 20px; color: #b8bdd0; }
    button {
      font: inherit; font-weight: 600; padding: 12px 28px; border: 0; border-radius: 8px;
      background: #5865f2; color: #fff; cursor: pointer;
    }
    button:hover { background: #4752c4; }
    .ok { color: #7ee787; }
    .ng { color: #ff7b72; }
  </style>
</head>
<body>
  <main>
    <h1>Unidan アカウント連携</h1>
    <p id="msg">読み込み中…</p>
    <button id="login" hidden>Discordでログイン</button>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ★ 自分のプロジェクトの値に書き換える(anon key は公開しても問題ないキー)
    const SUPABASE_URL = "https://loccmljhedfjtypwbwzl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nDKuLksfHlLNdyMlKHIOgg_dFa8ygSO";

    const msg = document.getElementById("msg");
    const btn = document.getElementById("login");
    const say = (text, cls) => { msg.textContent = text; msg.className = cls || ""; };

    // 注意: 認証後のリダイレクトで Supabase が ?code= を付けることがあるので、自前のパラメータは "link"
    const link = new URLSearchParams(location.search).get("link");

    if (!link || !/^[A-Z2-9]{16}$/.test(link)) {
      say("リンクが正しくありません。ゲームからやり直してください。", "ng");
    } else {
      main().catch((e) => { console.error(e); say("エラーが発生しました。ゲームからやり直してください。", "ng"); });
    }

    async function main() {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        say("Discordでログインして、ゲームとアカウントを連携します。");
        btn.hidden = false;
        btn.onclick = () => supabase.auth.signInWithOAuth({
          provider: "discord",
          options: { redirectTo: `${location.origin}${location.pathname}?link=${link}` },
        });
        return;
      }

      btn.hidden = true;
      say("連携中…");
      const res = await fetch(`${SUPABASE_URL}/functions/v1/auth-link-complete`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ link_code: link, refresh_token: session.refresh_token }),
      });

      // ゲーム側と同じ refresh_token を使い回すので、このブラウザには残さない。
      // signOut() はサーバー側のセッションごと失効させてしまうため使わず、ローカル保存だけ消す。
      Object.keys(localStorage).filter((k) => k.startsWith("sb-")).forEach((k) => localStorage.removeItem(k));

      if (res.ok) {
        say("連携が完了しました。ゲームに戻ってください。このページは閉じて大丈夫です。", "ok");
      } else {
        say("連携に失敗しました(期限切れの可能性があります)。ゲームからやり直してください。", "ng");
      }
    }
  </script>
</body>
</html>
